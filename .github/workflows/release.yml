name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            output: autocal50-linux-amd64
            tags: webkit2_41
          - os: windows-latest
            platform: windows/amd64
            output: autocal50-windows-amd64.exe
            tags: ""
          - os: macos-latest
            platform: darwin/universal
            output: autocal50-darwin-universal
            tags: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build
        run: wails build -platform ${{ matrix.platform }} ${{ matrix.tags && format('-tags {0}', matrix.tags) || '' }}

      - name: Rename binary
        if: runner.os != 'macOS'
        shell: bash
        run: mv build/bin/autocal50* build/bin/${{ matrix.output }}

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          cd build/bin
          ditto -c -k --keepParent autocal50.app ${{ matrix.output }}.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/${{ matrix.output }}
            build/bin/${{ matrix.output }}.zip
