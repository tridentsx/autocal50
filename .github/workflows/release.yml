name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
          go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build
        run: wails build -tags webkit2_41 -platform linux/amd64
      - name: Rename
        run: mv build/bin/autocal50 build/bin/autocal50-linux-amd64
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/autocal50-linux-amd64

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build
        run: wails build -platform windows/amd64
      - name: Rename
        run: move build\bin\autocal50.exe build\bin\autocal50-windows-amd64.exe
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/autocal50-windows-amd64.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest
      - name: Build
        run: wails build -platform darwin/universal
      - name: Package
        run: cd build/bin && ditto -c -k --keepParent autocal50.app autocal50-darwin-universal.zip
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/autocal50-darwin-universal.zip
